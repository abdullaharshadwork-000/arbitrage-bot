name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m pip install ruff bandit pip-audit
      - run: ruff check arbicore arbitrage_bot.py server.py start_live.py tests
      - run: bandit -q -r arbicore arbitrage_bot.py server.py start_live.py
      - run: pip-audit -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: |
          python -c "import server; server.bootstrap(); server.serve(ports=[8000])" &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ && break; sleep 1; done
          ARBICORE_URL=http://127.0.0.1:8000 npm test
